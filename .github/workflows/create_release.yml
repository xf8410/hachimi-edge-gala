name: Create Release

on: workflow_dispatch

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android
            target: aarch64-linux-android

    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> build
          prefix-key: ${{ matrix.target }}

############### ANDROID ##################

      - name: Setup and Patch Dependencies (Android)
        if: matrix.target == 'aarch64-linux-android'
        run: |
          pushd ..
          git clone --revision 44cdd653e2317d300fb8a6c9c36b03f23991e803 https://github.com/emilk/egui.git
          cd egui
          sed -i 's/ui.set_min_width(ui.available_width());/\/\/ ui.set_min_width(ui.available_width());/' crates/egui/src/containers/combo_box.rs
          popd

          echo -e "\negui = { path = '../egui/crates/egui' }" >> Cargo.toml
          echo "egui_extras = { path = '../egui/crates/egui_extras' }" >> Cargo.toml

      - name: Grant execute permission to build script
        if: matrix.target == 'aarch64-linux-android'
        run: chmod +x tools/android/build.sh

      - name: Build Hachimi for Android
        if: matrix.target == 'aarch64-linux-android'
        run: |
          RELEASE=1 ./tools/android/build.sh
        env:
          HACHIMI_IGNORE_DIRTY: "true"

      - name: Attest Android
        if: matrix.target == 'aarch64-linux-android'
        uses: actions/attest@v4
        with:
          subject-path: |
            build/*.so
            build/sha256.json

############### ARTIFACTS ##################

      - name: Upload Android binaries
        if: matrix.target == 'aarch64-linux-android'
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            build/*.so
            build/sha256.json

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get release version
        id: get_info
        run: |
          VERSION=$(awk '/^\[package\]/{flag=1} flag && /^version/{print $3; exit}' Cargo.toml | tr -d '"')
          echo "RELEASE_VERSION=v$VERSION" >> $GITHUB_ENV

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Debug artifact layout
        run: find artifacts -type f -exec ls -la {} \;

      - name: Create release notes
        run: |
          if ! git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
            git tag $LATEST_TAG
          fi

          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${LATEST_TAG}^" 2>/dev/null || true)
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          echo "## What's Changed" > CHANGELOG.md
          COMMIT_HASHES=$(git rev-list --no-merges ${PREVIOUS_TAG}..${LATEST_TAG})

          IFS=$'\n'

          for hash in $COMMIT_HASHES; do
            subject=$(git show -s --format=%s $hash)
            body=$(git show -s --format=%b $hash)
            author_login=$(gh api "repos/${{ github.repository }}/commits/$hash" --jq '.author.login' 2>/dev/null || echo "")
            if [ -n "$author_login" ]; then
              author="$author_login"
            else
              author=$(git show -s --format=%an $hash)
            fi
            short_hash=$(git show -s --format=%h $hash)

            echo "* **$subject**" >> CHANGELOG.md

            if [ -n "$body" ]; then
              echo "$body" | while read -r line; do
                if [ -z "$line" ]; then continue; fi
                clean_line=$(echo "$line" | sed -E 's/^[ \t]*[-*+][ \t]*//')
                echo "    * $clean_line" >> CHANGELOG.md
              done
            fi
            echo "    (by @$author in $short_hash)" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          done

          unset IFS
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_TAG: ${{ env.RELEASE_VERSION }}

      - name: Upload binaries to a release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGELOG.md
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.so
            artifacts/**/*.json
          tag_name: ${{ env.RELEASE_VERSION }}
